<title>Crétacé Park</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700;800&family=Russo+One&display=swap">
<style>
/* Crétacé Park — one committed dark "park control" theme: brushed steel frames, rivets,
   yellow/black hazard stripes, dark capsules, chunky Russo One titles. */
:root {
  color-scheme: dark;
  --bg: #0b0f12;
  --panel: #1b2228;
  --panel-2: #232c33;
  --panel-3: #2d3740;
  --line: #0a0d10;
  --txt: #ffffff;
  --txt-dim: #c3ccd3;
  --txt-mute: #8d99a4;
  --hz-y: #f6c21b;
  --hz-k: #1b1b1b;
  --good: #8fe04a;
  --bad: #ff6a55;
  --gold: #ffd23a;
  --font-title: 'Russo One', 'Arial Black', Impact, sans-serif;
  --font-ui: 'Exo 2', 'Segoe UI', system-ui, sans-serif;
  --outline: 0 2px 0 #0b0e10, 1.5px 1.5px 0 #0b0e10, -1.5px 1.5px 0 #0b0e10, 1.5px -1.5px 0 #0b0e10, -1.5px -1.5px 0 #0b0e10;
  --outline-lg: 0 4px 0 #0b0e10, 2.5px 2.5px 0 #0b0e10, -2.5px 2.5px 0 #0b0e10, 2.5px -2.5px 0 #0b0e10, -2.5px -2.5px 0 #0b0e10, 0 0 12px rgba(0,0,0,.55);
  --rivet: radial-gradient(circle at 45% 40%, #ffffff 0 1px, #b9c1c7 1.6px, #6c757c 3px, #2a3035 3.8px, transparent 4.4px);
  --steel-grad: linear-gradient(180deg, #eef1f3 0%, #c3cad0 16%, #a2abb3 49%, #8c959d 51%, #aeb6bd 84%, #d6dbdf 100%);
  --brush: repeating-linear-gradient(90deg, rgba(255,255,255,.07) 0 1px, rgba(0,0,0,.035) 1px 2px, transparent 2px 4px);
  --hazard: repeating-linear-gradient(-45deg, var(--hz-y) 0 10px, var(--hz-k) 10px 20px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background: var(--bg); color: var(--txt); }
body { font-family: var(--font-ui); font-size: 15px; line-height: 1.35; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
img { -webkit-user-drag: none; }
.hidden { display: none !important; }

#pc-app { position: fixed; inset: 0; overflow: hidden; background: radial-gradient(ellipse at 50% 40%, #1d2a22, #0b0f12 70%); }
#pc-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* ---------- Generic steel & buttons ---------- */
.steel {
  position: relative;
  background: var(--rivet) left 6px top 6px / 12px 12px no-repeat, var(--rivet) right 6px top 6px / 12px 12px no-repeat,
    var(--rivet) left 6px bottom 6px / 12px 12px no-repeat, var(--rivet) right 6px bottom 6px / 12px 12px no-repeat,
    var(--brush), var(--steel-grad);
  border-radius: 16px;
  box-shadow: 0 0 0 2px #14181b, inset 0 2px 0 rgba(255,255,255,.85), inset 0 -2px 0 rgba(0,0,0,.35), 0 14px 40px rgba(0,0,0,.65);
}
.inner {
  background: repeating-linear-gradient(45deg, rgba(255,255,255,.018) 0 2px, transparent 2px 9px), linear-gradient(180deg, #252e35, #161b20);
  border-radius: 10px;
  box-shadow: inset 0 0 0 2px #0b0e10, inset 0 4px 12px rgba(0,0,0,.7), 0 1px 0 rgba(255,255,255,.6);
}
.hz { height: 16px; border-radius: 4px; background: var(--hazard); box-shadow: inset 0 0 0 2px #1b1b1b, inset 0 3px 0 rgba(255,255,255,.3), inset 0 -3px 0 rgba(0,0,0,.25); }
.ttl { font-family: var(--font-title); color: #fff; text-shadow: var(--outline); letter-spacing: .5px; }

.b {
  --c1: #b4f06a; --c2: #5cbc26; --c3: #2e7a10; --ink: #163c05; --fg: #fff;
  appearance: none; border: 2px solid var(--ink); border-radius: 12px; padding: 8px 16px; min-height: 44px;
  background: linear-gradient(180deg, var(--c1) 0%, var(--c2) 50%, var(--c3) 100%);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.55), inset 0 -3px 0 rgba(0,0,0,.22), 0 3px 0 var(--ink), 0 6px 10px rgba(0,0,0,.45);
  color: var(--fg); font: 15px/1.1 var(--font-title); letter-spacing: .4px;
  text-shadow: 0 2px 0 var(--ink), 1px 1px 0 var(--ink), -1px 1px 0 var(--ink), 1px -1px 0 var(--ink), -1px -1px 0 var(--ink);
  cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; position: relative;
  transition: transform .06s, filter .15s; white-space: nowrap; touch-action: manipulation;
}
.b:hover { filter: brightness(1.08); }
.b:active { transform: translateY(2px); box-shadow: inset 0 2px 0 rgba(255,255,255,.4), inset 0 -2px 0 rgba(0,0,0,.22), 0 1px 0 var(--ink), 0 2px 5px rgba(0,0,0,.4); }
.b[disabled] { filter: grayscale(.9) brightness(.72); cursor: default; transform: none; }
.b img { width: 22px; height: 22px; filter: drop-shadow(0 1px 1px rgba(0,0,0,.5)); }
.b-orange { --c1: #ffd88a; --c2: #f59a1c; --c3: #bd5d05; --ink: #552700; }
.b-yellow { --c1: #fff8b0; --c2: #ffd21e; --c3: #d29600; --ink: #5a3e00; --fg: #2b1d00; text-shadow: 0 1px 0 rgba(255,255,255,.65); }
.b-red { --c1: #ff9d8f; --c2: #e2382a; --c3: #98140b; --ink: #470602; }
.b-blue { --c1: #a5dcff; --c2: #2f8fe0; --c3: #15529a; --ink: #08284c; }
.b-steel { --c1: #f6f8f9; --c2: #b9c1c8; --c3: #7f8890; --ink: #2a3036; --fg: #1b2126; text-shadow: 0 1px 0 rgba(255,255,255,.7); }
.b-dark { --c1: #4b555e; --c2: #2b333a; --c3: #1a1f24; --ink: #07090b; }
.b-sm { min-height: 40px; padding: 5px 11px; font-size: 13px; border-radius: 10px; }
.b-lg { min-height: 54px; font-size: 19px; padding: 10px 24px; border-radius: 14px; }
.b-xl { min-height: 68px; font-size: 32px; padding: 10px 54px; border-radius: 18px; border-width: 3px; }
.b .sub { font: 600 12px var(--font-ui); text-shadow: none; opacity: .95; }
.b .pill { display: inline-flex; align-items: center; gap: 3px; background: rgba(0,0,0,.28); border-radius: 8px; padding: 2px 7px 2px 3px; text-shadow: var(--outline); color: #fff; }
.b .pill img { width: 20px; height: 20px; }

.xbtn {
  position: absolute; top: -14px; right: -14px; width: 48px; height: 48px; border-radius: 50%; z-index: 4; cursor: pointer;
  border: 3px solid #2a0402; padding: 0;
  background: radial-gradient(circle at 36% 30%, #ffb3a6, #e2382a 42%, #8a0f08 100%);
  box-shadow: 0 0 0 3px #cdd3d8, 0 0 0 5px #252b30, 0 5px 10px rgba(0,0,0,.6), inset 0 2px 0 rgba(255,255,255,.35);
}
.xbtn::before, .xbtn::after { content: ''; position: absolute; left: 50%; top: 50%; width: 22px; height: 6px; border-radius: 3px; background: #fff; box-shadow: 0 1px 0 #6a0a04; transform: translate(-50%, -50%) rotate(45deg); }
.xbtn::after { transform: translate(-50%, -50%) rotate(-45deg); }
.xbtn:active { transform: scale(.94); }

.chips { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px 2px 3px; border-radius: 14px; background: linear-gradient(#20272d, #0d1114); border: 2px solid #000; box-shadow: 0 0 0 1.5px #66707a; font: 15px var(--font-title); color: #fff; text-shadow: var(--outline); }
.chip img { width: 24px; height: 24px; }
.chip.bad b { color: var(--bad); }
.muted { color: var(--txt-mute); }
.dim { color: var(--txt-dim); }
.good { color: var(--good); }
.badtxt { color: var(--bad); }
.bang { position: absolute; top: -7px; right: -7px; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 11px; background: radial-gradient(circle at 35% 30%, #ff9a8a, #e2261a 55%, #8a0a04); border: 2px solid #fff; color: #fff; font: 14px/18px var(--font-title); text-align: center; box-shadow: 0 2px 4px rgba(0,0,0,.5); animation: bangPulse 1.1s ease-in-out infinite; z-index: 2; pointer-events: none; }
@keyframes bangPulse { 50% { transform: scale(1.18); } }
.tag-red { position: absolute; left: 50%; top: -10px; transform: translateX(-50%); background: linear-gradient(#ff5a48, #c41d10); color: #fff; font: 10px var(--font-title); letter-spacing: .5px; padding: 2px 6px; border-radius: 6px; border: 1.5px solid #fff; box-shadow: 0 2px 4px rgba(0,0,0,.5); white-space: nowrap; animation: bangPulse 1.1s ease-in-out infinite; pointer-events: none; z-index: 2; }

.bar { position: relative; height: 16px; border-radius: 9px; background: #0b0f12; border: 2px solid #000; box-shadow: inset 0 2px 3px rgba(0,0,0,.8), 0 0 0 1.5px #6f7880; overflow: hidden; }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 7px; background: linear-gradient(#b8f070, #5cbc26 55%, #3a8a14); box-shadow: inset 0 2px 0 rgba(255,255,255,.4); transition: width .25s; }
.bar.hzfill > i { background: var(--hazard); background-size: 28.28px 28.28px; animation: hzSlide 1.2s linear infinite; }
.bar.blue > i { background: linear-gradient(#9ad8ff, #2f8fe0 55%, #15529a); }
.bar.gold > i { background: linear-gradient(#fff3a0, #ffc21e 55%, #c98a00); }
.bar > span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 11px var(--font-title); color: #fff; text-shadow: var(--outline); }
@keyframes hzSlide { to { background-position: 28.28px 0; } }

/* ---------- HUD ---------- */
#pc-hud { position: absolute; left: 0; right: 0; top: 0; z-index: 12; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; padding: calc(8px + var(--safe-t)) 12px 0; pointer-events: none; }
#pc-hud > * { pointer-events: auto; }
.hud-left { display: flex; align-items: flex-start; gap: 6px; }
.lvl-badge { width: 66px; height: 66px; border-radius: 50%; position: relative; flex: none; cursor: pointer;
  background: conic-gradient(from 210deg, #f6f8f9, #8a939b, #e2e6e9, #6a737b, #f0f2f4, #8a939b, #f6f8f9);
  box-shadow: 0 0 0 2px #14181b, 0 5px 10px rgba(0,0,0,.55); }
.lvl-badge::before { content: ''; position: absolute; inset: 6px; border-radius: 50%; background: radial-gradient(circle at 40% 28%, #5ab4ff, #1d63b8 55%, #0c2c58); box-shadow: inset 0 3px 5px rgba(0,0,0,.55), 0 0 0 2px #14181b; }
.lvl-badge .niv { position: absolute; top: 14px; left: 0; right: 0; text-align: center; font: 10px var(--font-title); color: #cfe6ff; letter-spacing: 1.5px; text-shadow: 0 1px 0 #06203f; }
.lvl-badge b { position: absolute; top: 24px; left: 0; right: 0; text-align: center; font: 26px/1 var(--font-title); color: #fff; text-shadow: var(--outline); }
.hud-col { display: flex; flex-direction: column; gap: 6px; padding-top: 4px; }
.xp { width: 150px; }
.xp .bar { height: 20px; border-radius: 11px; }
.xp .bar > i { border-radius: 9px; }
.xp .bar > span { font-size: 11px; }
.hud-btns { display: flex; gap: 6px; }
.sqbtn { position: relative; width: 48px; height: 48px; border-radius: 12px; border: 2px solid #1a1f23; padding: 0; cursor: pointer;
  background: var(--brush), var(--steel-grad);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.85), inset 0 -2px 0 rgba(0,0,0,.3), 0 3px 0 #1a1f23, 0 5px 8px rgba(0,0,0,.45);
  display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
.sqbtn img { width: 34px; height: 34px; filter: drop-shadow(0 2px 1px rgba(0,0,0,.45)); }
.sqbtn:active { transform: translateY(2px); }
.hud-right { display: flex; gap: 14px; align-items: center; justify-content: flex-end; flex-wrap: wrap; padding-top: 10px; }
.cap { position: relative; height: 32px; min-width: 100px; padding: 0 14px 0 34px; border-radius: 17px;
  background: linear-gradient(180deg, #262e35, #0b0f12); border: 2px solid #000;
  box-shadow: 0 0 0 2px #7b858e, inset 0 1px 0 rgba(255,255,255,.18), 0 4px 8px rgba(0,0,0,.5);
  display: flex; align-items: center; justify-content: flex-end; font: 17px var(--font-title); color: #fff; text-shadow: var(--outline); white-space: nowrap; }
.cap img { position: absolute; left: -10px; top: 50%; width: 40px; height: 40px; transform: translateY(-50%); filter: drop-shadow(0 2px 2px rgba(0,0,0,.6)); }
.cap.bump { animation: capBump .35s ease-out; }
@keyframes capBump { 40% { transform: scale(1.12); } }
.park-plate { position: absolute; left: 50%; top: calc(10px + var(--safe-t)); transform: translateX(-50%); z-index: 11; pointer-events: none; display: flex; align-items: center; gap: 0; }
.park-plate .hz { width: 34px; height: 12px; }
.park-plate span { font: 14px var(--font-title); letter-spacing: 1.5px; color: #fff; text-shadow: var(--outline); padding: 5px 14px; background: linear-gradient(#3a444c, #1a2025); border: 2px solid #0b0e10; border-radius: 8px; box-shadow: inset 0 1px 0 rgba(255,255,255,.18); }

/* ---------- Bottom bar ---------- */
#pc-bottombar, #pc-actionbar, #pc-placebar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 12; }
#pc-bottombar { display: flex; justify-content: center; gap: 8px; padding: 14px 10px calc(8px + var(--safe-b));
  background: var(--brush), linear-gradient(180deg, #59626a 0%, #39424a 22%, #262d33 100%);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.2), 0 -6px 18px rgba(0,0,0,.45); }
#pc-bottombar::before, #pc-actionbar::before, #pc-placebar::before { content: ''; position: absolute; left: 0; right: 0; top: -8px; height: 10px; background: var(--hazard); box-shadow: 0 2px 0 #0b0e10, 0 -2px 0 #0b0e10; }
.bb { position: relative; width: 78px; height: 72px; border-radius: 12px; padding: 0; cursor: pointer; flex: none;
  border: 2px solid #15191c;
  background: var(--rivet) left 2px top 2px / 9px 9px no-repeat, var(--rivet) right 2px top 2px / 9px 9px no-repeat, var(--brush), var(--steel-grad);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.85), inset 0 -2px 0 rgba(0,0,0,.3), 0 3px 0 #15191c, 0 6px 10px rgba(0,0,0,.5);
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start; overflow: visible; touch-action: manipulation; }
.bb img { width: 40px; height: 40px; margin-top: 5px; filter: drop-shadow(0 2px 1px rgba(0,0,0,.5)); transition: transform .12s; }
.bb:hover img { transform: scale(1.08); }
.bb:active { transform: translateY(2px); }
.bb .lbl { position: absolute; left: 4px; right: 4px; bottom: 4px; border-radius: 6px; background: linear-gradient(#2a3239, #12161a); color: #fff; font: 10px/16px var(--font-title); letter-spacing: .3px; text-align: center; text-shadow: 0 1px 0 #000; white-space: nowrap; overflow: hidden; }

/* ---------- Contextual action bar (buildings) ---------- */
#pc-actionbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px 14px; padding: 12px 12px calc(10px + var(--safe-b));
  background: var(--brush), linear-gradient(180deg, #59626a 0%, #39424a 22%, #262d33 100%); box-shadow: 0 -6px 18px rgba(0,0,0,.45); }
.ab-plate { display: flex; align-items: center; gap: 10px; min-width: 0; padding: 6px 12px 6px 6px; border-radius: 12px; background: linear-gradient(#1f262c, #0f1317); border: 2px solid #000; box-shadow: 0 0 0 2px #7b858e, inset 0 1px 0 rgba(255,255,255,.12); max-width: 420px; }
.ab-plate .th { width: 58px; height: 58px; flex: none; border-radius: 9px; background: radial-gradient(circle at 50% 40%, #3e4a54, #1a2026); box-shadow: inset 0 0 0 2px #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.ab-plate .th img { width: 56px; height: 56px; object-fit: contain; }
.ab-info { min-width: 0; flex: 1; }
.ab-name { font: 16px var(--font-title); color: #fff; text-shadow: var(--outline); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
.lvtag { flex: none; font: 11px var(--font-title); padding: 2px 6px; border-radius: 6px; background: linear-gradient(#5ab4ff, #1d63b8); border: 1.5px solid #06203f; color: #fff; text-shadow: 0 1px 0 #06203f; }
.ab-status { font: 600 13px var(--font-ui); color: var(--txt-dim); margin: 3px 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ab-plate .bar { height: 12px; width: 100%; min-width: 120px; }
.ab-btns { display: flex; gap: 10px; align-items: flex-start; }
.rbtn { display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: 0; padding: 0; cursor: pointer; width: 64px; touch-action: manipulation; }
.rbtn .disc { position: relative; width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  background: radial-gradient(circle at 50% 50%, var(--rc2, #39434b) 0 52%, transparent 54%), conic-gradient(from 200deg, #f6f8f9, #8a939b, #e2e6e9, #6a737b, #f0f2f4, #8a939b, #f6f8f9);
  box-shadow: 0 0 0 2px #14181b, 0 4px 8px rgba(0,0,0,.55); }
.rbtn .disc::before { content: ''; position: absolute; inset: 6px; border-radius: 50%; background: radial-gradient(circle at 40% 28%, var(--rc1, #6b7680), var(--rc2, #39434b) 60%, var(--rc3, #1b2126)); box-shadow: inset 0 2px 3px rgba(255,255,255,.25), inset 0 -3px 4px rgba(0,0,0,.4), 0 0 0 2px #14181b; }
.rbtn .disc img { position: relative; width: 32px; height: 32px; filter: drop-shadow(0 2px 1px rgba(0,0,0,.55)); }
.rbtn .rl { font: 10px var(--font-title); color: #fff; text-shadow: var(--outline); letter-spacing: .3px; white-space: nowrap; }
.rbtn .rc { font: 600 11px var(--font-ui); color: var(--gold); text-shadow: 0 1px 0 #000; display: flex; align-items: center; gap: 2px; margin-top: -2px; white-space: nowrap; }
.rbtn .rc img { width: 14px; height: 14px; }
.rbtn:active .disc { transform: translateY(2px); }
.rbtn[disabled] { opacity: .45; cursor: default; }
.rbtn.green { --rc1: #a6ec5a; --rc2: #4caf1e; --rc3: #1f5a08; }
.rbtn.orange { --rc1: #ffd27a; --rc2: #f08a12; --rc3: #7a3a02; }
.rbtn.blue { --rc1: #9ad8ff; --rc2: #2f86d8; --rc3: #0d3a70; }
.rbtn.red { --rc1: #ff9a8a; --rc2: #d8301e; --rc3: #6a0a04; }
.rbtn.yellow { --rc1: #fff59a; --rc2: #f2c20e; --rc3: #7a5a00; }
.ab-close { position: relative; top: 0; right: 0; flex: none; width: 44px; height: 44px; }

/* ---------- Placement bar ---------- */
#pc-placebar { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; padding: 12px 12px calc(10px + var(--safe-b));
  background: var(--brush), linear-gradient(180deg, #59626a 0%, #39424a 22%, #262d33 100%); box-shadow: 0 -6px 18px rgba(0,0,0,.45); }
.pl-info { display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 6px; border-radius: 12px; background: linear-gradient(#1f262c, #0f1317); border: 2px solid #000; box-shadow: 0 0 0 2px #7b858e; min-width: 0; }
.pl-info img.th { width: 46px; height: 46px; object-fit: contain; border-radius: 8px; background: #11161a; }
.pl-title { font: 15px var(--font-title); text-shadow: var(--outline); }
.pl-hint { font: 600 12px var(--font-ui); color: var(--txt-dim); }
.pl-hint.badtxt { color: var(--bad); }

/* ---------- Panels ---------- */
#pc-panels { position: absolute; inset: 0; z-index: 30; pointer-events: none; }
.pw { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 22px 16px; background: rgba(4,7,9,.6); pointer-events: auto; animation: fadeIn .18s ease-out; }
.panel { width: min(1000px, 100%); height: min(680px, 100%); display: flex; flex-direction: column; padding: 10px 12px 12px; animation: popIn .22s cubic-bezier(.2,1.4,.4,1); }
.panel.narrow { width: min(620px, 100%); }
.panel.auto-h { height: auto; max-height: 100%; }
.ph { display: flex; align-items: center; gap: 10px; height: 46px; flex: none; margin: 0 30px 8px 6px; }
.ph .hz { flex: 1; min-width: 16px; }
.pt { font: 25px/1 var(--font-title); color: #fff; text-shadow: var(--outline-lg); padding: 8px 20px 9px; background: linear-gradient(#3e4851, #1a2025); border: 2px solid #0b0e10; border-radius: 11px; box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 2px 0 rgba(255,255,255,.45); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; }
.pb { flex: 1; min-height: 0; display: flex; overflow: hidden; position: relative; }
.pb > .inner { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
.scroll-y { overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y; }
.scroll-x { overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-x; scrollbar-width: thin; scrollbar-color: #f6c21b #12171b; }
.scroll-x::-webkit-scrollbar, .scroll-y::-webkit-scrollbar { height: 10px; width: 10px; }
.scroll-x::-webkit-scrollbar-thumb, .scroll-y::-webkit-scrollbar-thumb { background: var(--hazard); border-radius: 5px; border: 2px solid #12171b; }
.scroll-x::-webkit-scrollbar-track, .scroll-y::-webkit-scrollbar-track { background: #12171b; border-radius: 5px; }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes popIn { from { transform: scale(.88); opacity: 0; } }
@keyframes slideUp { from { transform: translateY(110%); } }

/* Vertical category tabs */
.vtabs { flex: none; width: 112px; display: flex; flex-direction: column; gap: 8px; padding: 10px 0 10px 10px; }
.vtab { position: relative; display: flex; align-items: center; gap: 6px; min-height: 58px; padding: 6px 8px; border-radius: 12px 0 0 12px; cursor: pointer; border: 2px solid #0b0e10; border-right: 0;
  background: linear-gradient(#3a444c, #20272d); color: var(--txt-dim); font: 12px/1.1 var(--font-title); text-shadow: 0 1px 0 #000; text-align: left; box-shadow: inset 0 1px 0 rgba(255,255,255,.15); touch-action: manipulation; }
.vtab img { width: 38px; height: 38px; flex: none; filter: drop-shadow(0 2px 1px rgba(0,0,0,.5)); }
.vtab.on { background: var(--brush), var(--steel-grad); color: #1b2126; text-shadow: 0 1px 0 rgba(255,255,255,.7); margin-right: -2px; box-shadow: inset 0 2px 0 rgba(255,255,255,.85); }
.vtab.on::after { content: ''; position: absolute; left: 0; top: 6px; bottom: 6px; width: 5px; border-radius: 3px; background: var(--hazard); }
.htabs { display: flex; gap: 8px; padding: 10px 12px 0; flex: none; flex-wrap: wrap; }
.htab { position: relative; min-height: 42px; padding: 6px 16px; border-radius: 10px 10px 0 0; border: 2px solid #0b0e10; border-bottom: 0; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  background: linear-gradient(#3a444c, #20272d); color: var(--txt-dim); font: 14px var(--font-title); text-shadow: 0 1px 0 #000; touch-action: manipulation; }
.htab img { width: 26px; height: 26px; }
.htab.on { background: var(--brush), var(--steel-grad); color: #1b2126; text-shadow: 0 1px 0 rgba(255,255,255,.7); }
.tabline { height: 4px; flex: none; background: var(--steel-grad); margin: 0 12px; border-radius: 2px; }

.plate { display: inline-flex; align-items: center; gap: 8px; font: 18px var(--font-title); color: #fff; text-shadow: var(--outline); padding: 6px 14px; background: linear-gradient(#36414a, #171c21); border: 2px solid #0b0e10; border-radius: 10px; box-shadow: inset 0 1px 0 rgba(255,255,255,.18); }
.plate img { width: 28px; height: 28px; }
.sec-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px 6px; flex: none; flex-wrap: wrap; }
.sec-head .hint { font: 600 13px var(--font-ui); color: var(--txt-dim); }

/* Market cards */
.cards-row { position: relative; display: flex; gap: 14px; padding: 16px 16px 16px; align-items: flex-start; flex: 1; min-height: 0; }
.card { --f1: #c9d0d6; --f2: #7d868e; --f3: #3e454b; --glow: transparent;
  position: relative; flex: none; width: 178px; min-height: 236px; border-radius: 14px; padding: 5px; display: flex; flex-direction: column;
  background: linear-gradient(160deg, var(--f1), var(--f2) 45%, var(--f3));
  box-shadow: 0 0 0 2px #0b0e10, inset 0 2px 0 rgba(255,255,255,.6), 0 6px 14px rgba(0,0,0,.5), 0 0 18px var(--glow); }
.card.r-commun { --f1: #dfe3e6; --f2: #9aa3a8; --f3: #555d63; }
.card.r-rare { --f1: #a9d8ff; --f2: #4f9fe0; --f3: #1f5a94; --glow: rgba(79,159,224,.25); }
.card.r-super { --f1: #e2b8ff; --f2: #b06ae0; --f3: #5a2a86; --glow: rgba(176,106,224,.3); }
.card.r-legendaire { --f1: #fff0a8; --f2: #f0b030; --f3: #8a5a06; --glow: rgba(240,176,48,.38); }
.card.r-mythique { --f1: #ffb0c4; --f2: #ff3b6b; --f3: #7a0a26; --glow: rgba(255,59,107,.5); animation: mythGlow 1.8s ease-in-out infinite; }
@keyframes mythGlow { 50% { box-shadow: 0 0 0 2px #0b0e10, inset 0 2px 0 rgba(255,255,255,.6), 0 6px 14px rgba(0,0,0,.5), 0 0 30px rgba(255,59,107,.85); } }
.card.offer { --f1: #fff6b0; --f2: #ffc21e; --f3: #b86a00; --glow: rgba(255,194,30,.55); width: 200px; }
/* Card the game points at (mission / « Aller au marché »): pulsing yellow ring. */
.card.focus { animation: cardFocus 1.1s ease-in-out infinite; }
@keyframes cardFocus { 0%, 100% { box-shadow: 0 0 0 2px #0b0e10, 0 0 0 5px #ffd23a, 0 6px 14px rgba(0,0,0,.5), 0 0 12px 2px rgba(255,210,58,.55); }
  50% { box-shadow: 0 0 0 2px #0b0e10, 0 0 0 6px #fff27a, 0 6px 14px rgba(0,0,0,.5), 0 0 24px 8px rgba(255,210,58,.9); } }
.card .cn { font: 14px/1.05 var(--font-title); color: #fff; text-shadow: var(--outline); text-align: center; padding: 5px 4px 4px; min-height: 26px; display: flex; align-items: center; justify-content: center; }
.card .cr { font: 700 10px var(--font-ui); letter-spacing: 1px; text-transform: uppercase; text-align: center; color: #fff; text-shadow: 0 1px 0 #000; margin-top: -3px; margin-bottom: 3px; }
.card .ci { position: relative; flex: none; height: 178px; min-height: 112px; border-radius: 10px; overflow: hidden; background: radial-gradient(circle at 50% 40%, #3e4a54, #12171b); box-shadow: inset 0 0 0 2px rgba(0,0,0,.7); display: flex; align-items: center; justify-content: center; }
.card .ci img.art { width: 100%; height: 100%; object-fit: cover; }
.card .ci img.bart { width: 92%; height: 92%; object-fit: contain; }
.card .ci .cls { position: absolute; left: 4px; top: 4px; width: 26px; height: 26px; }
.card .ci .lockov { position: absolute; inset: 0; background: rgba(8,10,12,.55); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font: 13px var(--font-title); text-shadow: var(--outline); }
.card .ci .lockov img { width: 40px; height: 40px; }
.card .ci .done { position: absolute; inset: auto 0 0 0; padding: 4px; background: linear-gradient(transparent, rgba(0,0,0,.8)); font: 12px var(--font-title); text-align: center; text-shadow: var(--outline); }
.card .cinfo { display: flex; justify-content: center; align-items: center; gap: 6px; font: 700 12px var(--font-ui); color: #fff; text-shadow: 0 1px 0 #000, 0 0 3px #000; padding: 5px 2px 4px; min-height: 26px; flex-wrap: wrap; }
.card .cinfo img { width: 18px; height: 18px; vertical-align: middle; }
.card .cb { width: 100%; min-height: 42px; }
.card .owned { display: flex; align-items: center; justify-content: center; gap: 5px; min-height: 42px; border-radius: 10px; background: linear-gradient(#2c343b, #14181c); border: 2px solid #000; font: 13px var(--font-title); color: var(--txt-dim); text-shadow: 0 1px 0 #000; }
.card .owned img { width: 22px; height: 22px; }
.card .ribbon { position: absolute; top: 44px; left: -6px; right: -6px; text-align: center; font: 13px var(--font-title); color: #fff; padding: 3px 0; background: linear-gradient(#ff5a48, #b8180c); border: 2px solid #4a0602; border-radius: 4px; text-shadow: var(--outline); box-shadow: 0 3px 6px rgba(0,0,0,.5); z-index: 2; letter-spacing: .5px; }
.card .ytag { position: absolute; right: 6px; bottom: 6px; z-index: 2; font: 11px var(--font-title); color: #2b1d00; background: linear-gradient(#fff59a, #ffc21e); border: 2px solid #5a3e00; border-radius: 8px; padding: 2px 7px; box-shadow: 0 2px 4px rgba(0,0,0,.5); }

/* Lab */
.lab-wrap { flex: 1; min-height: 0; display: flex; gap: 12px; padding: 10px 12px 12px; }
.lab-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.lab-side { width: 170px; flex: none; display: flex; flex-direction: column; gap: 8px; }
.sp-strip { display: flex; gap: 8px; padding: 4px 2px 8px; flex: none; }
.sp-chip { position: relative; flex: none; width: 78px; border-radius: 10px; padding: 3px; cursor: pointer; border: 2px solid #0b0e10; background: linear-gradient(#3a444c, #1a2025); box-shadow: inset 0 1px 0 rgba(255,255,255,.15); touch-action: manipulation; }
.sp-chip.on { background: linear-gradient(#fff3a0, #e0a810); box-shadow: 0 0 12px rgba(255,210,30,.6); }
.sp-chip img { width: 100%; height: 54px; display: block; border-radius: 7px; object-fit: cover; }
.sp-chip .n { font: 10px/1.1 var(--font-title); text-align: center; color: #fff; text-shadow: var(--outline); padding: 3px 0 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sp-chip .st { position: absolute; top: -6px; right: -6px; width: 24px; height: 24px; }
.helix-bar { width: 100%; height: 50px; display: block; flex: none; }
.lab-mid { display: flex; gap: 12px; flex: 1; min-height: 0; align-items: stretch; }
.lab-portrait { width: 240px; flex: none; display: flex; flex-direction: column; gap: 6px; }
.lab-portrait canvas { width: 240px; height: 180px; border-radius: 12px; box-shadow: 0 0 0 2px #000, 0 0 0 4px #7b858e; background: #0d1216; display: block; }
.lab-ctrl { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.tubes { width: 100%; height: 170px; display: block; flex: none; }
.lab-status { font: 600 14px var(--font-ui); color: var(--txt-dim); min-height: 20px; }
.lab-status b { color: #fff; font-family: var(--font-title); font-weight: 400; }
.lab-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.boost { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font: 600 13px var(--font-ui); color: var(--txt-dim); padding: 4px 10px 4px 4px; border-radius: 10px; background: rgba(0,0,0,.3); border: 2px solid #000; min-height: 40px; }
.boost .box { width: 26px; height: 26px; border-radius: 6px; background: linear-gradient(#f6f8f9, #9aa3ab); border: 2px solid #1a1f23; display: flex; align-items: center; justify-content: center; font: 18px var(--font-title); color: #1f7a10; }
.assist { border-radius: 12px; padding: 6px; background: linear-gradient(#2c353d, #151a1f); border: 2px solid #000; box-shadow: inset 0 1px 0 rgba(255,255,255,.12); text-align: center; }
.assist canvas { width: 100%; height: 96px; border-radius: 8px; display: block; }
.assist .an { font: 12px var(--font-title); text-shadow: var(--outline); margin-top: 4px; }
.assist .ar { font: 600 11px var(--font-ui); color: var(--txt-mute); }
.exp-scene { width: 100%; height: 230px; display: block; border-radius: 12px; box-shadow: 0 0 0 2px #000, 0 0 0 4px #7b858e; flex: none; }
.promo-banner { display: flex; align-items: center; gap: 10px; padding: 6px 12px; border-radius: 10px; background: linear-gradient(90deg, #ffde3a, #ff9a1a); color: #2b1600; font: 15px var(--font-title); border: 2px solid #5a2a00; box-shadow: 0 0 16px rgba(255,180,30,.5); animation: bangPulse 1.6s ease-in-out infinite; }
.kv { display: flex; gap: 10px; flex-wrap: wrap; }
.kv > div { flex: 1; min-width: 92px; padding: 6px 10px; border-radius: 10px; background: rgba(0,0,0,.32); border: 2px solid #000; }
.kv small { display: block; font: 700 10px var(--font-ui); letter-spacing: 1px; color: var(--txt-mute); text-transform: uppercase; }
.kv b { font: 17px var(--font-title); color: #fff; text-shadow: var(--outline); display: flex; align-items: center; gap: 4px; }
.kv b img { width: 20px; height: 20px; }
.strike { text-decoration: line-through; color: var(--txt-mute); font-size: 13px; }

/* Creature / building panels */
.cp { flex: 1; min-height: 0; display: flex; gap: 14px; padding: 12px; overflow-y: auto; overscroll-behavior: contain; }
.cp-art { width: 46%; flex: none; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.cp-art canvas { width: 100%; height: auto; aspect-ratio: 1 / 1; min-height: 200px; flex: none; border-radius: 12px; box-shadow: 0 0 0 2px #000, 0 0 0 4px #7b858e; display: block; }
.cp-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.cp-name { font: 24px/1.05 var(--font-title); text-shadow: var(--outline-lg); }
.cp-sub { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font: 600 13px var(--font-ui); color: var(--txt-dim); }
.rtag { font: 11px var(--font-title); letter-spacing: .6px; padding: 3px 8px; border-radius: 7px; color: #fff; text-shadow: 0 1px 0 #000; border: 1.5px solid rgba(0,0,0,.6); }
.stars { display: inline-flex; gap: 1px; }
.stars img { width: 22px; height: 22px; }
.stars img.off { filter: grayscale(1) brightness(.45); }
.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.panel.narrow .stat-grid { grid-template-columns: repeat(2, 1fr); }
.stat { padding: 6px 8px; border-radius: 10px; background: rgba(0,0,0,.32); border: 2px solid #000; display: flex; align-items: center; gap: 6px; min-width: 0; }
.stat img { width: 26px; height: 26px; flex: none; }
.stat small { display: block; font: 700 10px var(--font-ui); letter-spacing: .8px; color: var(--txt-mute); text-transform: uppercase; }
.stat b { font: 15px var(--font-title); text-shadow: var(--outline); white-space: nowrap; }
.pips { display: flex; gap: 5px; align-items: center; }
.pip { width: 22px; height: 14px; border-radius: 4px; background: #0d1114; border: 2px solid #000; box-shadow: 0 0 0 1px #5d666e; }
.pip.on { background: linear-gradient(#c8f87a, #4caf1e); box-shadow: 0 0 0 1px #5d666e, 0 0 6px rgba(143,224,74,.6); }
.lvl-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.lvl-big { font: 30px/1 var(--font-title); text-shadow: var(--outline-lg); }
.evo-hint { font: 600 13px var(--font-ui); color: var(--gold); }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn-row .b { flex: 1 1 auto; }
.order-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.order { border-radius: 14px; padding: 8px; background: linear-gradient(#2e3840, #151a1f); border: 2px solid #000; box-shadow: 0 0 0 2px #7b858e, inset 0 1px 0 rgba(255,255,255,.15); display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.order canvas { width: 100%; height: 84px; }
.order .on { font: 14px var(--font-title); text-shadow: var(--outline); }

/* Missions */
.ms { flex: 1; min-height: 0; display: flex; }
.ms-tabs { width: 92px; flex: none; display: flex; flex-direction: column; gap: 8px; padding: 10px 0 10px 10px; }
.ms-tab { position: relative; height: 70px; border-radius: 12px 0 0 12px; border: 2px solid #0b0e10; border-right: 0; cursor: pointer; background: linear-gradient(#3a444c, #20272d); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; touch-action: manipulation; }
.ms-tab img { width: 40px; height: 40px; filter: drop-shadow(0 2px 1px rgba(0,0,0,.5)); }
.ms-tab span { font: 9px var(--font-title); color: var(--txt-dim); text-shadow: 0 1px 0 #000; letter-spacing: .3px; }
.ms-tab.on { background: var(--brush), var(--steel-grad); margin-right: -2px; }
.ms-tab.on span { color: #1b2126; text-shadow: none; }
.ms-tab .bang { top: 2px; right: 4px; }
.ms-body { flex: 1; min-width: 0; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.ms-head { display: flex; gap: 14px; align-items: flex-start; }
.ms-npc { width: 120px; height: 144px; flex: none; border-radius: 12px; box-shadow: 0 0 0 2px #000, 0 0 0 4px #7b858e; display: block; }
.ms-who { font: 700 12px var(--font-ui); color: var(--gold); letter-spacing: .5px; text-transform: uppercase; }
.ms-title { font: 22px/1.1 var(--font-title); text-shadow: var(--outline-lg); margin: 2px 0 6px; }
.ms-text { font: 600 15px/1.45 var(--font-ui); color: var(--txt-dim); min-height: 44px; }
.goal { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: rgba(0,0,0,.35); border: 2px solid #000; box-shadow: inset 0 1px 0 rgba(255,255,255,.08); }
.cbox { width: 30px; height: 30px; flex: none; border-radius: 7px; background: linear-gradient(#f6f8f9, #9aa3ab); border: 2px solid #1a1f23; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 -2px 0 rgba(0,0,0,.2); }
.cbox.on { background: linear-gradient(#b4f06a, #3a8a14); }
.cbox.on::after { content: ''; width: 14px; height: 8px; border-left: 4px solid #fff; border-bottom: 4px solid #fff; transform: rotate(-45deg) translate(1px, -2px); }
.goal .gt { flex: 1; font: 700 14px var(--font-ui); }
.goal .gn { font: 16px var(--font-title); text-shadow: var(--outline); white-space: nowrap; }
.rw-label { font: 700 11px var(--font-ui); letter-spacing: 1px; text-transform: uppercase; color: var(--txt-mute); }

/* Modals */
#pc-modals { position: absolute; inset: 0; z-index: 50; pointer-events: none; }
.mw { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 18px; background: rgba(3,5,7,.72); pointer-events: auto; animation: fadeIn .2s ease-out; }
.modal { width: min(520px, 100%); max-height: 100%; display: flex; flex-direction: column; padding: 10px 12px 12px; animation: popIn .26s cubic-bezier(.2,1.5,.4,1); }
.modal .ph { margin-right: 34px; }
.modal .ph .hz { min-width: 12px; }
.modal .pt { max-width: none; font-size: 22px; padding: 8px 14px; }
.modal .inner { padding: 16px; display: flex; flex-direction: column; gap: 12px; align-items: center; text-align: center; overflow-y: auto; }
.modal .mtxt { font: 600 15px/1.45 var(--font-ui); color: var(--txt-dim); }
.modal .mtxt b { color: #fff; }
.banner { position: relative; font: 30px/1.05 var(--font-title); color: #fff; text-shadow: var(--outline-lg); text-align: center; letter-spacing: .5px; }
.banner.gold { color: #ffe066; }
.rays { position: absolute; inset: -20%; z-index: 0; background: repeating-conic-gradient(from 0deg, rgba(255,220,120,.16) 0 10deg, transparent 10deg 20deg); animation: spin 14s linear infinite; pointer-events: none; border-radius: 50%; -webkit-mask: radial-gradient(circle, #000 20%, transparent 65%); mask: radial-gradient(circle, #000 20%, transparent 65%); }
@keyframes spin { to { transform: rotate(360deg); } }
.big-badge { position: relative; width: 120px; height: 120px; border-radius: 50%; background: conic-gradient(from 210deg, #f6f8f9, #8a939b, #e2e6e9, #6a737b, #f0f2f4, #8a939b, #f6f8f9); box-shadow: 0 0 0 3px #14181b, 0 0 40px rgba(255,210,60,.6); animation: popIn .5s cubic-bezier(.2,1.8,.4,1); }
.big-badge::before { content: ''; position: absolute; inset: 10px; border-radius: 50%; background: radial-gradient(circle at 40% 28%, #5ab4ff, #1d63b8 55%, #0c2c58); box-shadow: inset 0 3px 6px rgba(0,0,0,.55), 0 0 0 3px #14181b; }
.big-badge span { position: absolute; top: 26px; left: 0; right: 0; text-align: center; font: 14px var(--font-title); color: #cfe6ff; letter-spacing: 2px; }
.big-badge b { position: absolute; top: 42px; left: 0; right: 0; text-align: center; font: 46px/1 var(--font-title); color: #fff; text-shadow: var(--outline-lg); }
.unlocks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; width: 100%; }
.unlocks li { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 10px; background: rgba(0,0,0,.32); border: 2px solid #000; font: 700 14px var(--font-ui); text-align: left; }
.unlocks li img { width: 24px; height: 24px; flex: none; }
.confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.confetti i { position: absolute; top: -20px; width: 9px; height: 14px; border-radius: 2px; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

/* Evolution overlay */
.evo { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 18px; pointer-events: auto; overflow: hidden;
  background: radial-gradient(ellipse at 50% 45%, #3a2a0a 0%, #120d05 55%, #050403 100%); animation: fadeIn .3s; }
.evo .rays { inset: -60%; }
.evo-row { position: relative; display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: nowrap; max-width: 100%; }
.evo-card { position: relative; border-radius: 16px; padding: 6px; background: var(--brush), var(--steel-grad); box-shadow: 0 0 0 2px #14181b, 0 10px 30px rgba(0,0,0,.6); text-align: center; flex: 0 1 auto; min-width: 0; }
.evo-card canvas, .evo-card img { width: 100%; display: block; border-radius: 11px; }
.evo-card .en { font: 14px var(--font-title); color: #1b2126; padding: 5px 0 2px; }
.evo-card.before { width: min(200px, 34vw); opacity: .9; }
.evo-card.after { width: min(300px, 50vw); box-shadow: 0 0 0 2px #14181b, 0 0 50px rgba(255,210,60,.75); }
.evo-card.after img { animation: evoReveal 1.4s ease-out both; }
@keyframes evoReveal { 0% { filter: brightness(8) saturate(0); transform: scale(.7); } 45% { filter: brightness(5) saturate(0); transform: scale(1.08); } 100% { filter: none; transform: scale(1); } }
.evo-arrow { font: 44px var(--font-title); color: #ffd23a; text-shadow: var(--outline-lg); animation: arrowNudge 0.9s ease-in-out infinite; flex: none; }
